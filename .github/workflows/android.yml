name: Android APK

on:
  push:
    branches:
      - main
      - 'build/apk-tablet-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK from runner
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dex_WIFI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
